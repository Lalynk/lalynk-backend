spring.application.name=lalynk-backend


spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=true

spring.jpa.hibernate.ddl-auto=validate
#Resource server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER}
spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCES}

#Oauth2 client
spring.security.oauth2.client.registration.auth0.client-id=${AUTH0_Client_ID}
spring.security.oauth2.client.registration.auth0.client-secret=${AUTH0_CLIENT_SECRET}
spring.security.oauth2.client.registration.auth0.scope=openid,profile,email
spring.security.oauth2.client.provider.auth0.issuer-uri=${AUTH0_ISSUER}

secret.encryption.key={SECRET_ENCRYPTION_KEY}